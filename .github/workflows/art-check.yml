# Checks the masters in manifest.json: every picture outside archive/ is
# used (a pose, a launcher icon or an exported moment picture), and face
# and launcher icons are headshots while everything else is full body.
name: Art check

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; pushes to master and merge
# queue entries each keep theirs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed. The check reads
  # manifest.json and the pictures outside docs/, never the Markdown or
  # licence texts, so a docs-only change skips it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - id: changed
        uses: AnkiQuest/AnkiQuest-Dev/.github/actions/code-changed@5ab685e7013b865630f96530ca8c654344738fa8

  art-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the check
        run: cargo test --manifest-path tools/art-check/Cargo.toml
      - name: Check the masters
        run: cargo run --manifest-path tools/art-check/Cargo.toml -- .
